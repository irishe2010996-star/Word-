<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word🤓☝️ settings</title>
  <style>
    html { color-scheme: light dark; }
    body { font: 14px/1.55 system-ui, sans-serif; min-width: 280px; max-width: 420px; margin: 16px; }
    h1 { font-size: 18px; }
    label { display: block; }
    input { display: block; box-sizing: border-box; width: 100%; padding: 5px; font: inherit; }
    button { font: inherit; cursor: pointer; margin: 3px 3px 3px 0; }
  </style>
</head>
<body>
  <h1>Word🤓☝️</h1>
  <p>Click a word in the reader to see its English definition.</p>
  <form>
    <label>Merriam-Webster Learner’s Dictionary API key
      <input id="merriam-key" type="password" placeholder="Leave blank to use Wiktionary" autocomplete="off" spellcheck="false" maxlength="120">
    </label>
    <button id="save" disabled>Save</button>
    <a href="https://dictionaryapi.com/register/index" target="_blank" rel="noopener noreferrer">Get an API key</a>
    <p id="dictionary-status" role="status"></p>
  </form>
  <img width="50" height="50" src="assets/merriam-webster.png" alt="Merriam-Webster">
  <hr>
  <button id="enable" disabled>Enable on this site</button>
  <p id="site-status" role="status"></p>
  <script src="settings.js"></script>
</body>
</html>
